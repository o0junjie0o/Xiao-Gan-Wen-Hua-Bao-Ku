kind = "web"
previewPath = "/"
title = "孝感非遗文化数字化平台"
version = "1.0.0"
id = "artifacts/xiaogan-intangible"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18490

[services.development]
run = "pnpm --filter @workspace/xiaogan-intangible run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xiaogan-intangible", "run", "build" ]
publicDir = "artifacts/xiaogan-intangible/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18490"
BASE_PATH = "/"
